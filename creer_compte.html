<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ToyCycle</title>
        <link rel="stylesheet" href="css/form.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <main class="register-page">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-7 col-md-9">
                        <div class="register-card">
                            <div class="register-header">
                                <h1>Créer un compte</h1>
                                <p>
                                    Rejoignez la communauté ToyCycle et donnez une
                                    seconde vie aux jouets.
                                </p>
                            </div>
                            <form id="registerForm">
                                <!-- Nom -->
                                <div class="mb-3">
                                    <label for="nom" class="form-label">
                                        Nom
                                    </label>
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="nom"
                                        placeholder="Votre nom"
                                        required>
                                </div>
                                <!-- Prénom -->
                                <div class="mb-3">
                                    <label for="prenom" class="form-label">
                                        Prénom
                                    </label>
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="prenom"
                                        placeholder="Votre prénom"
                                        required>
                                </div>
                                <!-- Email -->
                                <div class="mb-3">
                                    <label for="email" class="form-label">
                                        Email
                                    </label>
                                    <input
                                        type="email"
                                        class="form-control"
                                        id="email"
                                        placeholder="exemple@email.com"
                                        required>
                                </div>
                                <!-- Ville -->
                                <div class="mb-3">
                                    <label for="ville" class="form-label">
                                        Ville
                                    </label>
                                    <select
                                        class="form-select"
                                        id="ville"
                                        required>
                                        <option value="">
                                            Sélectionner votre ville
                                        </option>
                                        <option>Agadir</option>
                                        <option>Casablanca</option>
                                        <option>Rabat</option>
                                        <option>Marrakech</option>
                                        <option>Tanger</option>
                                        <option>Fès</option>
                                        <option>Meknès</option>
                                        <option>Oujda</option>
                                        <option>Laâyoune</option>
                                        <option>Dakhla</option>
                                    </select>
                                </div>
                                <!-- Téléphone -->
                                <div class="mb-3">
                                    <label for="telephone" class="form-label">
                                        Téléphone (WhatsApp)
                                    </label>
                                    <input
                                        type="tel"
                                        class="form-control"
                                        id="telephone"
                                        placeholder="06 12 34 56 78"
                                        required>
                                </div>
                                <!-- Mot de passe -->
                                <div class="mb-3 position-relative">
                                    <label for="password" class="form-label">
                                        Mot de passe
                                    </label>
                                    <input
                                        type="password"
                                        class="form-control"
                                        id="password"
                                        placeholder="********"
                                        required>
                                    <i class="fa-solid fa-eye toggle-password"
                                    data-target="password"></i>
                                </div>
                                <!-- Confirmation -->
                                <div class="mb-3 position-relative">
                                    <label for="confirmPassword" class="form-label">
                                        Confirmer le mot de passe
                                    </label>
                                    <input
                                        type="password"
                                        class="form-control"
                                        id="confirmPassword"
                                        placeholder="********"
                                        required>
                                    <i class="fa-solid fa-eye toggle-password"
                                    data-target="confirmPassword"></i>
                                </div>
                                <!-- Conditions -->
                                <div class="form-check mb-4">
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="conditions">
                                    <label
                                        class="form-check-label"
                                        for="conditions">
                                        J'ai lu et j'accepte les
                                        <a href="conditions.html">
                                            Conditions d'utilisation
                                        </a>
                                    </label>
                                </div>
                                <!-- Bouton -->
                                <button
                                    type="submit"
                                    class="register-btn">
                                    <i class="fa-solid fa-user-plus"></i>
                                    S'inscrire
                                </button>
                            </form>
                            <div class="login-link">
                                Déjà un compte ?
                                <a href="se_connecter.html">Se connecter</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/js_creer_cpt.js"></script>
    </body>
</html>
